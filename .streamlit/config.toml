[theme]
# Aspecto Windows 2000 (el resto, en theme.py): gris de ventana, texto negro, campos blancos, azul marino.
base = "light"
primaryColor = "#0a246a"
backgroundColor = "#d4d0c8"
secondaryBackgroundColor = "#ffffff"
textColor = "#000000"
font = "sans serif"

[server]
# Streamlit recibe la subida en memoria (~2x el archivo) antes de que la app la pase a disco.
# Medido con un drz del Hubble de 203 MB: pico de 578 MB. Streamlit Cloud garantiza ~690 MB.
maxUploadSize = 200
